<style>
:root{
 --night:#15101d;--night-2:#1d1629;--night-3:#2a2140;
 --paper:#f7f4ef;--card:#fffdf9;--ink:#2a2234;--muted:#7d7389;
 --violet:#7452cc;--violet-deep:#5c3daf;--violet-bright:#a78bf2;--lilac:#efe9fb;
 --peach:#f6c5ab;--gold:#c69c55;--line:#e9e3ed;
 --on-night:#f2edfb;--on-night-muted:#b3a8c7;
 --shadow-card:0 30px 70px -32px rgba(43,30,70,.35),0 2px 6px rgba(43,30,70,.05);
 --shadow-soft:0 14px 34px -20px rgba(43,30,70,.25);
 --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","NSimSun",SimSun,serif;
 --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
 --latin:Georgia,"Times New Roman",serif;
 --ease:cubic-bezier(.22,1,.36,1);
 font-family:var(--sans);color:var(--ink);background:var(--paper);font-synthesis:none;
 -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100dvh;background:
 radial-gradient(900px 520px at 8% -6%,#efeaf8 0,transparent 60%),
 radial-gradient(820px 520px at 102% 108%,#fae7dc 0,transparent 55%),
 var(--paper);
 transition:background .4s ease}
button,input,select{font:inherit}
button,select,summary{cursor:pointer}
button{border:0;background:none;padding:0;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--violet-bright);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
::selection{background:#d9cbf7}

#sky{position:fixed;inset:0;z-index:-2;opacity:0;transition:opacity .6s ease}
body[data-view=home] #sky{opacity:1}
.aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .6s ease;overflow:hidden}
body[data-view=home] .aurora{opacity:1}
.aurora::before,.aurora::after{content:'';position:absolute;border-radius:50%;filter:blur(70px)}
.aurora::before{width:46vw;height:46vw;min-width:380px;min-height:380px;left:-12vw;top:-16vw;
 background:radial-gradient(circle,rgba(122,82,214,.34),rgba(122,82,214,0) 68%);animation:drift 26s ease-in-out infinite alternate}
.aurora::after{width:40vw;height:40vw;min-width:320px;min-height:320px;right:-14vw;bottom:-18vw;
 background:radial-gradient(circle,rgba(246,197,171,.16),rgba(246,197,171,0) 68%);animation:drift 32s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(4vw,3vw,0) scale(1.12)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;mix-blend-mode:multiply;
 background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23n)" opacity="0.05"/></svg>')}
body[data-view=home] .grain{mix-blend-mode:screen;opacity:.4}

#app{position:relative;z-index:2;max-width:1120px;margin:auto;padding:30px 30px 60px}

/* ---------- shared ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;letter-spacing:.01em}
.brand-mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;
 border:1.4px solid currentColor;color:var(--violet);background:#ffffff70}
.brand-room{font-weight:400;color:var(--muted);font-size:14px;margin-left:2px}
.quiet{color:var(--muted);font-size:13px;min-height:44px;padding:8px 10px;border-radius:8px;transition:color .15s}
.quiet:hover{color:var(--violet)}
.quiet:disabled{opacity:.4;cursor:default}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:14px 26px;
 border-radius:14px;background:linear-gradient(135deg,#8060d6,#6845bf);color:#fff;font-size:15px;font-weight:600;
 box-shadow:0 16px 32px -14px rgba(104,69,191,.7),inset 0 1px 0 #ffffff33;transition:transform .16s var(--ease),box-shadow .16s,filter .16s}
.primary:hover{filter:brightness(1.06);box-shadow:0 20px 40px -14px rgba(104,69,191,.75),inset 0 1px 0 #ffffff33}
.primary:active{transform:scale(.98)}
.primary:disabled{opacity:.4;cursor:default;filter:none;box-shadow:none}
.secondary{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:13px 24px;border-radius:14px;
 background:var(--card);border:1.5px solid var(--line);color:var(--ink);font-size:14px;font-weight:500;
 transition:border-color .15s,transform .16s var(--ease),background .15s}
.secondary:hover{border-color:#c3b3e4;background:#fbf9ff}
.secondary:active{transform:scale(.98)}
.ghost{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 4px;color:var(--muted);font-size:14px;border-radius:8px;transition:color .15s}
.ghost:hover{color:var(--violet)}
.full{width:100%}
.small{font-size:13px;color:var(--muted)}
.center{text-align:center}
.eyebrow{margin:0 0 18px;font-size:12px;letter-spacing:4px;color:var(--violet);font-weight:500}
.error{color:#b04265;font-size:13px;min-height:0;margin:0}
.error:not(:empty){padding-top:10px}
a{color:var(--violet)}

/* ---------- home : night ---------- */
body[data-view=home]{background:
 radial-gradient(1200px 700px at 50% -10%,#2c2147 0,transparent 60%),
 radial-gradient(900px 600px at 100% 100%,#241a38 0,transparent 55%),
 var(--night);color:var(--on-night)}
body[data-view=home] .brand{color:var(--on-night)}
body[data-view=home] .brand-mark{color:var(--violet-bright);background:#ffffff10;border-color:#ffffff33}
body[data-view=home] .brand-room{color:var(--on-night-muted)}
.hero-night{text-align:center;padding:46px 16px 60px;max-width:900px;margin:0 auto}
.hero-night .eyebrow{color:var(--violet-bright)}
.hero-night h1{font-family:var(--serif);font-weight:600;font-size:clamp(38px,6.4vw,72px);line-height:1.22;
 letter-spacing:-.02em;margin:0;color:var(--on-night);text-wrap:balance}
.hero-night h1 em{font-style:normal;position:relative;white-space:nowrap;
 padding-bottom:.14em;
 background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 12"><path d="M3 7 Q 22 1 40 6 T 78 6 T 127 5" fill="none" stroke="%23f6c5ab" stroke-width="4" stroke-linecap="round"/></svg>') no-repeat left calc(100% - .06em)/100% .32em}
.lede{margin:26px auto 0;color:var(--on-night-muted);font-size:16px;line-height:2}
.cta{display:inline-flex;align-items:center;gap:12px;margin-top:34px;padding:16px 30px;border-radius:999px;
 background:linear-gradient(135deg,#8d6cf0,#6d48c9);color:#fff;text-decoration:none;font-size:15px;font-weight:600;
 box-shadow:0 18px 44px -14px rgba(141,108,240,.75),inset 0 1px 0 #ffffff40;transition:transform .2s var(--ease),box-shadow .2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 24px 50px -14px rgba(141,108,240,.85),inset 0 1px 0 #ffffff40}
.cta-arrow{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#ffffff22;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.steps{list-style:none;display:flex;justify-content:center;gap:0;margin:54px auto 0;padding:0;max-width:560px}
.steps li{position:relative;flex:1;font-size:13px;color:var(--on-night-muted);padding-top:26px;letter-spacing:.05em}
.steps li::before{content:'';position:absolute;top:7px;left:0;right:0;height:1px;background:#ffffff26}
.steps li:first-child::before{left:50%}
.steps li:last-child::before{right:50%}
.steps li::after{content:'';position:absolute;top:2px;left:50%;width:11px;height:11px;border-radius:50%;
 transform:translateX(-50%);background:var(--night);border:1.6px solid var(--violet-bright)}
.steps li:first-child::after{background:var(--violet-bright);box-shadow:0 0 0 5px rgba(167,139,242,.18)}
.steps i{display:block;font-family:var(--latin);font-style:italic;font-size:15px;color:var(--violet-bright);margin-bottom:3px}

.spread{display:grid;grid-template-columns:1.02fr .98fr;gap:44px;align-items:center;max-width:1040px;margin:0 auto}
.stage{position:relative;display:flex;flex-direction:column;align-items:center}
.oracle{position:relative;width:100%;max-width:430px}
.oracle::before{content:'';position:absolute;inset:8% 6%;border-radius:50%;
 background:radial-gradient(circle,rgba(167,139,242,.32),transparent 66%);filter:blur(34px)}
.oracle-frame{position:relative;background:linear-gradient(180deg,#fffdf7,#f6efe4);border:1px solid rgba(198,156,85,.55);
 outline:1px solid rgba(198,156,85,.22);outline-offset:6px;border-radius:24px;padding:26px 26px 20px;
 box-shadow:var(--shadow-card);text-align:center}
.selected-character{width:252px;max-width:78%;margin:2px auto 0;display:flex;align-items:center;justify-content:center}
.selected-character .character-window{--cw:100%;--ch:300px}
.character-caption{display:flex;flex-direction:column;gap:3px;margin-top:14px}
.character-caption strong{font-family:var(--latin);font-style:italic;font-size:30px;font-weight:700;color:var(--violet-deep);letter-spacing:.02em}
.character-caption span{font-size:13px;color:var(--muted)}
.cast{display:flex;justify-content:center;gap:18px;margin-top:30px;width:100%}
.cast-fig{margin:0;width:86px;background:#fdfaf4;border:1px solid #ffffff1f;border-radius:16px;padding:8px 8px 4px;
 display:flex;flex-direction:column;align-items:center;
 box-shadow:0 18px 36px -22px rgba(0,0,0,.8);opacity:.62;transition:opacity .25s,transform .25s var(--ease)}
.cast-fig .character-window{--cw:100%;--ch:104px}
.cast-fig:nth-child(1){transform:rotate(-5deg) translateY(6px)}
.cast-fig:nth-child(2){transform:translateY(-6px);opacity:.85}
.cast-fig:nth-child(3){transform:rotate(5deg) translateY(6px)}
.cast-fig:hover{opacity:1;transform:translateY(-8px) rotate(0)!important}
.cast-fig figcaption{text-align:center;font-family:var(--latin);font-size:11px;color:var(--on-night-muted);padding:2px 0 4px}

.card{background:var(--card);border:1px solid #0000000d;border-radius:24px;box-shadow:var(--shadow-card)}
.entry{padding:34px 34px 30px;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.entry h2{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:-.02em;margin:0 0 8px}
.entry-note{font-size:14px;line-height:1.8;color:var(--muted);margin:0 0 22px}
.type-picker{display:grid;gap:14px}
.type-group-label{display:block;font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:8px;padding-left:2px}
.type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.type-button{min-height:44px;border-radius:11px;background:var(--paper);border:1.5px solid transparent;color:var(--ink);
 font-family:var(--latin);font-size:14px;font-weight:700;letter-spacing:.04em;
 transition:background .15s,border-color .15s,transform .12s var(--ease),color .15s}
.type-button:hover{border-color:#c9b9ec}
.type-button:active{transform:scale(.96)}
.type-button[aria-pressed=true]{background:linear-gradient(135deg,#8060d6,#6845bf);color:#fff;border-color:transparent;
 box-shadow:0 10px 22px -10px rgba(104,69,191,.7)}
.unknown-type{align-self:flex-start;margin:14px 0 4px;font-size:13px;color:var(--violet);text-decoration:underline;
 text-underline-offset:5px;min-height:36px;border-radius:6px}
.unknown-type:hover{color:var(--violet-deep)}
.start-btn{margin-top:18px}
.answer-guidance{font-size:13px;color:var(--muted);margin:14px 0 0;line-height:1.7}
.resume-count{display:inline-block;font-size:12.5px;color:var(--violet-deep);background:var(--lilac);border-radius:999px;
 padding:6px 14px;margin:14px 0 0}
.entry details{margin-top:16px;font-size:13px;line-height:1.85;color:var(--muted)}
.entry details p{margin:8px 0}
.entry summary{min-height:40px;color:var(--ink);font-weight:500}
.coda{text-align:center;margin:74px 0 10px}
.coda p{font-family:var(--serif);font-size:clamp(22px,3.4vw,34px);font-weight:500;letter-spacing:-.01em;color:var(--on-night);opacity:.92;margin:0}
.coda p::before,.coda p::after{content:'※';color:var(--violet-bright);font-size:.7em;margin:0 .7em;vertical-align:.12em}

/* character sprite (geometry kept from source) */
.character-window{display:block;position:relative;overflow:hidden;mix-blend-mode:multiply;flex-shrink:0}
.character-window.fit-w{width:var(--cw,100%);height:auto}
.character-window.fit-h{height:var(--ch,100%);width:auto;margin-inline:auto}
.character-window img{position:absolute;max-width:none;user-select:none;pointer-events:none}
.face{width:54px;height:60px;border:2px solid var(--violet);border-radius:50% 50% 45% 45%;position:relative;margin:auto}
.face::after{content:'·  ·';position:absolute;inset:0;text-align:center;font-size:28px;line-height:46px;color:var(--violet)}

/* ---------- question ---------- */
.q-wrap{max-width:720px;margin:36px auto 0}
.q-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;letter-spacing:1.5px;color:var(--violet-deep);
 background:var(--lilac);border:1px solid #ddd1f5;border-radius:999px;padding:7px 14px;white-space:nowrap}
.chip::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--violet)}
.progress-button{font-size:13px;color:var(--violet);min-height:40px;padding:6px 8px;border-radius:8px;text-underline-offset:5px}
.progress-button:hover{text-decoration:none}
.track{height:6px;border-radius:99px;background:#e7e0ec;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#6d48c9,#a78bf2);
 transition:width .45s var(--ease);width:0}
.q-title{font-family:var(--serif);font-size:clamp(23px,3.2vw,31px);font-weight:600;line-height:1.65;
 letter-spacing:-.01em;margin:24px 0 22px}
.scenarios{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
.scenario{display:flex;gap:13px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
 border-radius:18px;padding:18px 20px;box-shadow:var(--shadow-soft)}
.scenario .letter{flex-shrink:0;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;
 background:var(--night);color:#fff;font-family:var(--latin);font-style:italic;font-weight:700;font-size:16px;margin-top:2px}
.scenario:nth-child(2) .letter{background:var(--violet)}
.scenario p{margin:0;font-size:14.5px;line-height:1.85}
.answers{display:grid;gap:10px}
.answer{display:flex;align-items:center;gap:13px;width:100%;text-align:left;min-height:54px;padding:14px 18px;
 background:var(--card);border:1.5px solid var(--line);border-radius:15px;font-size:14.5px;line-height:1.6;
 transition:transform .14s var(--ease),border-color .14s,background .14s,box-shadow .14s}
.answer:hover{border-color:#c2b1e6;transform:translateY(-1px);box-shadow:var(--shadow-soft)}
.answer:active{transform:scale(.992)}
.answer .radio{flex-shrink:0;width:19px;height:19px;border-radius:50%;border:1.6px solid #c2b8cf;position:relative;transition:border-color .14s}
.answer .key{margin-left:auto;flex-shrink:0;min-width:24px;height:24px;padding:0 6px;display:inline-grid;place-items:center;
 border:1px solid var(--line);border-radius:7px;font-family:var(--latin);font-size:12px;color:var(--muted);
 background:var(--paper);transition:opacity .14s}
.answer[aria-checked=true]{background:linear-gradient(180deg,#f3eeff,#ece4fc);border-color:var(--violet);color:var(--violet-deep)}
.answer[aria-checked=true] .radio{border-color:var(--violet)}
.answer[aria-checked=true] .radio::after{content:'';position:absolute;inset:3.5px;border-radius:50%;background:var(--violet)}
.answer[aria-checked=true] .key{background:var(--violet);border-color:var(--violet);color:#fff}
.answers.is-advancing{pointer-events:none}
.answers.is-advancing .answer:not([aria-checked=true]){opacity:.38;transform:scale(.992)}
.answer.answer-picked{animation:answerPick .28s var(--ease) both}
@keyframes answerPick{0%{transform:scale(1)}45%{transform:scale(.975)}100%{transform:scale(1.008)}}
.q-nav{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:26px}
.next-btn{min-width:168px}
.hint{text-align:center;font-size:12px;color:var(--muted);margin:20px 0 0}
.hint kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;margin:0 2px;
 border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--card);font-family:var(--latin);font-size:11px}
.saved{text-align:center;font-size:12px;color:var(--muted);margin-top:10px}
.q-wrap.enter-next{animation:qNext .42s var(--ease) both}
.q-wrap.enter-prev{animation:qPrev .42s var(--ease) both}
@keyframes qNext{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes qPrev{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

/* ---------- report ---------- */
.report{max-width:960px;margin:26px auto 0;animation:reportIn .6s var(--ease) both}
@keyframes reportIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.result-hero{text-align:center;padding:10px 20px 36px}
.moon-stage{position:relative;width:248px;height:248px;margin:0 auto 24px}
.orbit{position:absolute;border-radius:50%;pointer-events:none}
.orbit-1{inset:-20px;border:1.5px dashed rgba(116,82,204,.4);animation:spin 48s linear infinite}
.orbit-1 i{position:absolute;top:-5px;left:50%;width:9px;height:9px;border-radius:50%;background:var(--peach);
 box-shadow:0 0 12px 2px rgba(246,197,171,.8)}
.orbit-2{inset:-46px;border:1px solid rgba(122,114,137,.22)}
@keyframes spin{to{transform:rotate(360deg)}}
.moon{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;overflow:visible;
 background:radial-gradient(circle at 36% 30%,#fffef9,#f3ebdd 72%,#eadfc9);
 border:1.5px solid rgba(198,156,85,.6);box-shadow:0 30px 60px -24px rgba(60,40,100,.4),inset 0 -14px 34px -20px rgba(150,110,40,.35)}
.moon .character-window{--cw:84%;--ch:88%;mix-blend-mode:multiply}
.moon .character-window.legacy-cell{width:78%;height:auto}
.moon .character-window.legacy-cell img{width:400%;height:auto}
.result-hero .eyebrow{margin-bottom:10px}
.type-code{font-family:var(--latin);font-style:italic;font-weight:700;font-size:clamp(58px,9vw,96px);line-height:1;
 color:var(--violet-deep);letter-spacing:.01em;margin:6px 0 12px}
.result-hero h2{font-family:var(--serif);font-size:23px;font-weight:600;margin:0 0 12px}
.result-hero .intro{font-size:14.5px;line-height:1.9;color:var(--ink);max-width:430px;margin:0 auto 18px}
.pill{display:inline-block;font-size:12.5px;padding:8px 18px;border-radius:999px;background:var(--night);color:var(--on-ground,#f2edfb);letter-spacing:.04em}
.close-note{font-size:13px!important;color:var(--muted)!important;max-width:430px;margin:16px auto 0!important;line-height:1.8}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.panel{background:var(--card);border:1px solid #0000000d;border-radius:24px;padding:30px;box-shadow:var(--shadow-card)}

<script>
globalThis.MY_QUESTIONS = (() => {
const rows = `周五晚上，你状态不错，周末也没急事。朋友约你吃饭，你原本打算在家做喜欢的事。|想去，和朋友见面本身就很有吸引力。|想保留原来的独处时间，改天再约。
听完一期有意思的播客，你脑子里有些零散想法。朋友也听过，问你怎么看。|先想一会儿，等观点清楚些再聊。|先聊起来，在交流中弄清自己的想法。
你提前到了一个兴趣活动现场，旁边有人也在等候，气氛轻松。|自然地聊几句，等候也会更有意思。|自己看看现场，等活动开始也很舒服。
和喜欢的朋友愉快地相处了一下午，大家提议继续吃晚饭。你不累，也没有其他安排。|想结束聚会，留一点时间自己待着。|愿意继续，正聊得投入。
一个新爱好既可以独自练习，也可以参加小组，费用和便利程度相近。|更想参加小组，与人一起投入让我期待。|更想独自练习，按自己的节奏进入状态。
小组讨论一个你熟悉的话题。你有初步观点，但还没有完整论据。|先在心里整理，想完整些再提出。|先提出初步观点，借讨论继续完善。
周末独自在家做了半天喜欢的事，进展顺利。接下来还有两小时空闲。|想找人聊聊或见面，换成互动的状态。|想继续自己做点事情，暂时不需要交流。
朋友把你拉进一个友善的新群，大家正在讨论你感兴趣的话题。|先看一阵，熟悉大家的表达方式再加入。|看到想接的话就参与，边聊边熟悉。

const DETECT_DIM_NAMES=['精力来源','信息偏好','判断方式','安排风格'];
const DETECT_EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>';
function buildDetection(answers,r){
 const a=id=>answers[id];
 // 12 个破绽信号：6 个自陈信号 + 6 个作答行为信号
 const signals=[];
 const add=(key,text)=>signals.push({key,text});
 if(a(57)===3)add('should','社交题里，你承认「觉得自己应该更主动」会影响选择。');
 if(a(58)===3)add('image','你承认有时会选「看起来更聪明或专业」的做法。');
 if(a(59)===2||a(59)===3)add('image','你承认有时会选「看起来更讲道理／更体贴」的回答。');
 if(a(60)===3)add('should','安排题里，「觉得自己应该更自律」影响了你的选择。');
 if(a(61)===2||a(61)===3)add('ideal','整份问卷你最常依据「希望成为的样子」或「某个类型会作的选择」作答。');
 if(a(61)===4)add('drift','你承认不同题目采用了不同的判断依据。');
 let extreme=0;
 for(let id=1;id<=48;id++){const v=a(id);if(v===0||v===4)extreme++;}
 const extremeRatio=extreme/48;
 const extremeDims=[];
 r.dimensions.forEach((d,i)=>{let sign=0,sameSign=true,allExtreme=true,valid=0;
  for(let j=0;j<12;j++){const id=i*12+j+1,v=a(id);if(!Number.isInteger(v)||v<0||v>4){allExtreme=false;continue;}
   const value=(2-v)*(j%2===0?1:-1);valid++;
   if(value===0){allExtreme=false;continue;}
   if(!sign)sign=value>0?1:-1;else if((value>0?1:-1)!==sign)sameSign=false;
   if(Math.abs(value)!==2)allExtreme=false;}
  if(valid&&sign&&sameSign&&allExtreme)extremeDims.push(i);});
 if(extremeRatio>=0.72)add('extreme','48 道正题里有 '+extreme+' 道选了「明显」倾向，全程几乎没有犹豫。');
 extremeDims.forEach(i=>add('extreme','「'+DETECT_DIM_NAMES[i]+'」的 12 道题全部选了同一方向的「明显」，整齐得不像自然反应。'));
 let flips=0;
 for(let k=0;k<4;k++){const x=a(49+k*2),y=a(50+k*2);if(Number.isInteger(x)&&Number.isInteger(y)&&Math.abs(x-y)>=3)flips++;}
 if(flips>=2)add('flip','情境对照题中有 '+flips+' 对答案，在两种身份下大幅翻转。');
 const flaw=Math.min(signals.length,12);
 const flawPct=Math.round(flaw/12*100);
 // 把握度：方向强度 + 果断比例 + 情境稳定 - 难以代入 - 接近中间的维度
 const avgStr=r.dimensions.reduce((s,d)=>s+Math.abs(d.mean),0)/4;
 let lean=0;for(let id=1;id<=48;id++){const v=a(id);if(v===0||v===1||v===3||v===4)lean++;}
 let stable=0;for(let k=0;k<4;k++){const x=a(49+k*2),y=a(50+k*2);if(Number.isInteger(x)&&Number.isInteger(y)&&x===y)stable++;}
 let hard=0;for(let id=1;id<=48;id++)if(a(id)===5)hard++;
 const close=r.dimensions.filter(d=>d.close).length;
 const conf=Math.max(35,Math.min(97,Math.round(42+avgStr*28+(lean/48)*18+(stable/4)*7-hard*1.2-close*3)));
 // 最大破绽：按信号归组，取痕迹最多的一组
 const groupDefs=[
  {key:'ideal',name:'理想投影',desc:'部分答案来自「希望自己成为的样子」，理想形象盖过了最近半年的真实反应。'},
  {key:'image',name:'形象管理',desc:'你替「看起来更聪明、更得体」的自己答了几题，真实偏好被让到了一边。'},
  {key:'should',name:'应该框架',desc:'「应该更主动／更自律」的念头替你做了选择。这不是撒谎，但会盖住天性。'},
  {key:'extreme',name:'用力过猛',desc:()=>{const di=extremeDims[0];return di===undefined?'几乎每题都选「明显」，没有犹豫也没有例外——用力过猛本身就是痕迹。':'你在「'+DETECT_DIM_NAMES[di]+'」上题题都选得很满，反而最显眼，真实的人很少这么整齐。';}},
  {key:'flip',name:'随境而变',desc:'同一个处境换个身份，答案就大幅翻转——固定的四字母反而装不住你。'},
  {key:'drift',name:'依据漂移',desc:'不同题目你换了不同的判断依据，画像里有几处对不上，把握度因此下降。'}
 ];
 const groups=groupDefs.map(g=>({...g,score:signals.filter(s=>s.key===g.key).length})).filter(g=>g.score>0).sort((x,y)=>y.score-x.score);
 const big=!groups.length?{name:'藏得不错',clean:true,desc:'没有看到明显的美化痕迹，这张画像基本是你自己画的。当然，这仍不是准确率证明。'}
  :{name:groups[0].name,clean:false,desc:typeof groups[0].desc==='function'?groups[0].desc():groups[0].desc};
 return {conf,flaw,flawPct,signals:signals.slice(0,12),big};
}
function detectionMarkup(det){

 +'<div class="detect-grid">'
 +'<div class="detect-card"><p class="dc-label">把握度</p><div class="detect-num"><strong>'+det.conf+'</strong><span>%</span></div>'
 +'<div class="detect-bar conf"><i style="--w:'+det.conf+'%"></i></div>'
 +'<p class="dc-note">基于作答一致性，对你真实画像的把握。</p></div>'

 +'<details class="detect-signals"><summary>'+(det.signals.length?'识破信号明细（'+det.signals.length+' 条）':'为什么没有发现信号？')+'</summary>'
 +(det.signals.length?'<ul>'+det.signals.map(s=>'<li>'+escape(s.text)+'</li>').join('')+'</ul>'
  :'<ul><li class="clean">补充题里你没有选择「应该／理想形象」类选项，正题作答也没有过度整齐。</li><li class="clean">情境对照题的答案保持了稳定，没有大幅翻转。</li></ul>')
 +'</details></div></div>'
 +'<p class="detect-foot">基于作答模式的趣味提示，用于自我核对，不是测谎结论，也不会改变你的类型结果。</p></section>';
}

 const previous=state.previous==='unknown'?null:state.previous;

 const evidence=chosen.source==='reference'||chosen.source==='confirmation'?[]:chosen.source==='context'||validContext?cx.ids:chosen.evidence.sort((a,b)=>Math.abs(b.value)-Math.abs(a.value)).slice(0,3).map(e=>e.id);
 const dimMeters=r.dimensions.map((d,i)=>{

 }).join('');

 +'</div><div class="report-grid">'
 +'<section class="panel"><h3>和上次相比</h3>'
 +'<div class="comparison"><div class="plate"><span>16Personalities</span><strong>'+(previous||'未填写')+'</strong></div><span class="compare-arrow" aria-hidden="true">→</span><div class="plate"><span>本次探索</span><strong class="current">'+r.type+'</strong></div></div>'
 +'<p class="report-copy"><strong>'+escape(topic)+'</strong><br>'+escape(explanation)+'</p>'
 +'<details class="proof" open><summary>看看答题依据</summary>'+evidence.map(id=>{const q=Q[id-1],a=state.answers[id];return '<p><span class="id">题目 '+id+'</span><br>'+escape(q.text)+'<br>你的选择：'+(a===2?'两边差不多':a===5?'难以代入':escape(a<2?q.a:q.b))+(a!==2&&a!==5?'（'+(a===0||a===4?'明显':'稍微')+'倾向）':'')+'</p>';}).join('')
 +'<p>情境差异不能单独证明哪一个回答更真实。两套问卷只比较类型方向，分数不直接相减。</p></details>'
 +'<details class="proof"><summary>查看四个维度</summary>'+dimMeters+'</details>'
 +(r.reviewIdeal?'<details class="proof"><summary>回看你的作答方式</summary><p>你在补充题中提到，部分选择可能考虑了理想形象或某个类型。可以核对相关答案；这不等于你在撒谎，也不会自动扣分。</p><button class="quiet" data-action="review">返回检查答案</button></details>':'')
 +(r.reference?'<details class="proof"><summary>查看同分候选</summary><p>同分候选：'+r.candidates.join('、')+'。本页按固定排列展示第一个候选；不是随机判型，也不表示它比其他同分候选更准确。</p></details>':'')
 +'<details class="proof"><summary>关于本次结果</summary><p>本工具使用原创61题规则，目前用于性格探索。四字母由前48题的方向汇总；对照题和动机题提供补充解释，不自动反转类型。</p><p>结果只在16个标准类型中匹配。先参考主问卷的分数方向；完全持平时再参考情境题与已确认的偏好。仍然同分时，展示固定排列中的一个参考候选并标明同分；有效回答不足时会提示。当前规则尚未经正式信效度验证，不是准确率或测谎概率。'+(r.insufficient.length?'本次部分维度有效回答较少，建议回看答案后再核对。':'')+'</p></details>'
 +'</section>'
 +detectionMarkup(buildDetection(state.answers,r))
 +'<section class="panel career-panel"><h3>适合的职业方向</h3>'
 +'<p class="career-label">核心匹配</p><div class="career-tags">'+(careers[r.type]?.core||[]).map(t=>'<span class="career-tag core">'+escape(t)+'</span>').join('')+'</div>'
 +'<p class="career-label">延伸方向</p><div class="career-tags">'+(careers[r.type]?.more||[]).map(t=>'<span class="career-tag">'+escape(t)+'</span>').join('')+'</div>'
 +'<div class="chart-note">基于偏好倾向的方向参考，不是能力判定或选择限制。</div></section>'
 +'</div>'
 +'<div class="report-actions"><button class="primary" data-action="share">保存我的性格卡</button><button class="secondary" data-action="review">修改答案</button><button class="ghost" data-action="restart">重新测试</button></div></section>';
 app.querySelector('[data-action=home]').onclick=()=>setView('home');
 app.querySelectorAll('[data-action=review]').forEach(b=>b.onclick=()=>{state.pos=0;navDir='next';setView('question');});
 app.querySelector('[data-action=restart]').onclick=()=>confirmRestart();
 app.querySelector('[data-action=share]').onclick=()=>share(r,previous,title);
}

function dialog(content){
 const wrap=document.createElement('div');wrap.className='dialog-backdrop';
 wrap.innerHTML='<section class="dialog" role="dialog" aria-modal="true" aria-label="操作窗口">'+content+'</section>';
 const before=document.activeElement;document.body.append(wrap);
 const close=()=>{wrap.remove();before?.focus();};
 wrap.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
 wrap.onclick=e=>{if(e.target===wrap)close();};
 wrap.onkeydown=e=>{if(e.key==='Escape')close();if(e.key==='Tab'){const list=[...wrap.querySelectorAll('button,a,input')];const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}};
 wrap.querySelector('button,a')?.focus();
 return {wrap,close};
}
function showProgress(){
 const done=Object.keys(state.answers).length;
 const d=dialog('<h2>整体进度</h2><p class="small">已完成 '+done+' / 61 · 还剩 '+(61-done)+' 题</p><div class="progress-legend"><span>● 已答</span><span>○ 未答</span><span>□ 当前</span></div><div class="question-grid">'+order.map((id,i)=>'<button type="button" data-jump="'+i+'" class="question-number '+(state.answers[id]!==undefined?'is-answered':'')+' '+(state.pos===i?'is-current':'')+'" aria-label="第'+(i+1)+'题，'+(state.answers[id]!==undefined?'已答':'未答')+(state.pos===i?'，当前题':'')+'" '+(state.pos===i?'aria-current="step"':'')+'>'+(i+1)+'</button>').join('')+'</div><div class="buttons"><button class="primary" id="next-unanswered">继续未答题</button><button class="secondary" data-close>关闭</button></div>');
 d.wrap.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{d.close();state.pos=+b.dataset.jump;navDir='next';persist();question();window.scrollTo({top:0,behavior:'instant'});app.querySelector('.question-title').focus({preventScroll:true});});
 d.wrap.querySelector('#next-unanswered').onclick=()=>{const i=order.findIndex(id=>state.answers[id]===undefined);d.close();if(i<0){setView('result');return;}state.pos=i;navDir='next';setView('question');};
 if(done===61)d.wrap.querySelector('#next-unanswered').textContent='查看结果';
}
function confirmRestart(){
 const d=dialog('<h2>开始一次新的探索？</h2><p class="small">本次答案和结果将清空。原四字母类型会保留。</p><div class="buttons"><button class="secondary" data-close>保留本次</button><button class="primary" id="confirm-restart">重新开始</button></div>');
 d.wrap.querySelector('#confirm-restart').onclick=()=>{d.close();state.answers={};state.clarifications={};state.pos=0;navDir='next';setView('question');};
}

/* ---------- share card : night almanac ---------- */
function seededStars(count,w,h){let seed=20261017;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
 return Array.from({length:count},()=>({x:rnd()*w,y:rnd()*h,r:.6+rnd()*1.6,a:.25+rnd()*.65,spark:rnd()<.08}));}

 c.globalAlpha=1;

 c.strokeStyle='rgba(198,156,85,.65)';c.lineWidth=1.5;c.beginPath();c.moveTo(80,118);c.lineTo(300,118);c.stroke();

 c.save();c.shadowColor='rgba(120,80,200,.4)';c.shadowBlur=70;c.shadowOffsetY=24;c.fillStyle=moon;c.beginPath();c.arc(my,430,mr,0,Math.PI*2);c.fill();c.restore();
 c.strokeStyle='rgba(198,156,85,.75)';c.lineWidth=2.5;c.beginPath();c.arc(my,430,mr+14,0,Math.PI*2);c.stroke();
 c.strokeStyle='rgba(167,139,242,.35)';c.setLineDash([3,10]);c.lineWidth=2;c.beginPath();c.arc(my,430,mr+34,0,Math.PI*2);c.stroke();c.setLineDash([]);
 if(index>=0&&sheetImage.naturalWidth){const rect=characterData.regions[r.type],sw=rect.w,sh=rect.h,ratio=Math.min(330/sw,330/sh);c.drawImage(sheetImage,rect.x,rect.y,sw,sh,my-sw*ratio/2,430-sh*ratio/2,sw*ratio,sh*ratio);}
 else{c.fillStyle='#7452cc';c.font='italic 700 84px Georgia,serif';c.textAlign='center';c.fillText('Meet',my,452);}
 c.textAlign='center';

/* ---------- night sky ---------- */
const sky=document.getElementById('sky'),sctx=sky.getContext('2d');let skyStars=[],skyW=0,skyH=0;
function resizeSky(){const dpr=Math.min(2,window.devicePixelRatio||1);skyW=window.innerWidth;skyH=window.innerHeight;sky.width=skyW*dpr;sky.height=skyH*dpr;sctx.setTransform(dpr,0,0,dpr,0,0);
 skyStars=Array.from({length:skyW<600?70:130},()=>({x:Math.random()*skyW,y:Math.random()*skyH*.92,r:.5+Math.random()*1.3,p:Math.random()*Math.PI*2,s:.5+Math.random()*.9}));}
function skyFrame(t){
 if(document.body.dataset.view==='home'&&skyW){sctx.clearRect(0,0,skyW,skyH);for(const s of skyStars){const a=.2+.55*(.5+.5*Math.sin(t/1000*s.s+s.p));sctx.globalAlpha=a;sctx.fillStyle='#e9e1ff';sctx.beginPath();sctx.arc(s.x,s.y,s.r,0,Math.PI*2);sctx.fill();}sctx.globalAlpha=1;}
 requestAnimationFrame(skyFrame);
}
window.addEventListener('resize',resizeSky);

load();render();resizeSky();requestAnimationFrame(skyFrame);
requestAnimationFrame(()=>{const b=document.getElementById('boot');if(b){b.classList.add('boot-done');setTimeout(()=>b.remove(),600);}});
})();
